services:
  - type: web
    name: redx-mailer
    env: go
    buildCommand: go build -o app
    startCommand: ./app
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1